[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/world",
    "crates/renderer",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Minecraft Rust Clean-Room Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async & Networking
tokio = { version = "1.43", features = ["full"] }
bytes = "1.10"

# Compression & Math
flate2 = "1.0"
glam = "0.29"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
